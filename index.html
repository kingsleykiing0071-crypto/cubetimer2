<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07090f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Flashmat — Speedcubing Timer</title>
  <style>
:root {
  --bg0: #07090f;
  --bg1: #0e121c;
  --bg2: #151b28;
  --panel: rgba(18, 24, 38, 0.72);
  --panel-solid: #121826;
  --line: rgba(255, 255, 255, 0.08);
  --line2: rgba(255, 255, 255, 0.14);
  --text: #eef3ff;
  --muted: #8b97b0;
  --faint: #5d6980;
  --accent: #3dffb0;
  --accent-2: #6ea8ff;
  --accent-dim: rgba(61, 255, 176, 0.14);
  --warn: #ffcc4d;
  --danger: #ff5d73;
  --plus: #ffb020;
  --ready: #7dff6b;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
  --radius: 22px;
  --ok: #3dffb0;
  --timer: #f5f8ff;
  --grid: rgba(110, 168, 255, 0.06);
}
[data-theme="light"] {
  --bg0: #eef2f8;
  --bg1: #f7f9fd;
  --bg2: #ffffff;
  --panel: rgba(255, 255, 255, 0.7);
  --panel-solid: #ffffff;
  --line: rgba(20, 30, 50, 0.08);
  --line2: rgba(20, 30, 50, 0.14);
  --text: #121826;
  --muted: #5b6780;
  --faint: #8a94a8;
  --accent: #0db37a;
  --accent-2: #3b6cff;
  --accent-dim: rgba(13, 179, 122, 0.12);
  --warn: #d49200;
  --danger: #e03b55;
  --plus: #d48900;
  --ready: #18b34a;
  --shadow: 0 16px 40px rgba(30, 50, 80, 0.12);
  --timer: #121826;
  --grid: rgba(59, 108, 255, 0.07);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; min-height: 100vh; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, sans-serif;
  background: var(--bg0);
  color: var(--text);
  overflow: auto;
  user-select: none;
}
.bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(900px 500px at 10% -10%, rgba(61, 255, 176, 0.12), transparent 50%),
    radial-gradient(800px 420px at 110% 0%, rgba(110, 168, 255, 0.16), transparent 46%),
    radial-gradient(700px 500px at 50% 120%, rgba(255, 93, 115, 0.08), transparent 50%),
    linear-gradient(180deg, var(--bg1), var(--bg0));
}
.app {
  position: relative; z-index: 1;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  max-width: 1480px;
  margin: 0 auto;
  padding: calc(12px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom));
  gap: 12px;
}
header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: 6px; }
.logo {
  width: 38px; height: 38px; border-radius: 12px;
  display: grid; place-items: center;
  background: linear-gradient(145deg, #3dffb0, #2ad0ff);
  color: #06110c; font-weight: 800; font-size: 15px;
}
.brand h1 { margin: 0; font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; }
.brand small { display: block; color: var(--muted); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
.spacer { flex: 1; }
.chip, select.chip, button.chip {
  appearance: none;
  border: 1px solid var(--line2);
  background: var(--panel);
  color: var(--text);
  border-radius: 999px;
  padding: 8px 12px;
  font: 600 12px/1 system-ui, sans-serif;
  cursor: pointer;
}
button.icon {
  width: 38px; height: 38px; border-radius: 12px;
  border: 1px solid var(--line2);
  background: var(--panel);
  color: var(--text);
  cursor: pointer;
  display: grid; place-items: center;
}
button.icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.scramble-wrap { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.scramble {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  min-height: 64px;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
}
.scramble b {
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: clamp(14px, 2.2vw, 20px);
  font-weight: 600;
  line-height: 1.45;
}
.preview {
  width: 168px; min-height: 92px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  display: grid; place-items: center;
  padding: 10px;
}
.net { display: grid; grid-template-columns: repeat(4, 26px); grid-template-rows: repeat(3, 26px); gap: 3px; }
.net .empty { visibility: hidden; }
.face { display: grid; grid-template-columns: repeat(3, 7px); grid-template-rows: repeat(3, 7px); gap: 1.5px; }
.sticker { width: 7px; height: 7px; border-radius: 1.5px; }
.stage { display: grid; grid-template-columns: 280px 1fr 280px; gap: 12px; min-height: 0; }
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  min-height: 0;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.panel h2 {
  margin: 0;
  padding: 14px 16px 10px;
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex; justify-content: space-between; align-items: center;
}
.list { overflow: auto; padding: 0 8px 12px; }
.solve {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 8px;
  align-items: center;
  padding: 8px;
  border-radius: 12px;
  cursor: pointer;
}
.solve:hover, .solve.active { background: var(--accent-dim); }
.solve .idx { color: var(--faint); font-size: 11px; }
.solve .t { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; font-size: 14px; }
.solve .t.dnf { color: var(--danger); }
.solve .t.plus { color: var(--plus); }
.solve .meta { color: var(--faint); font-size: 10px; text-align: right; }
.timer-card {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer;
}
.state-pill {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 6px 12px;
  border: 1px solid var(--line2);
  border-radius: 999px;
  margin-bottom: 8px;
}
#clock {
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-weight: 800;
  font-size: clamp(64px, 14vw, 128px);
  letter-spacing: -0.04em;
  line-height: 0.9;
  color: var(--timer);
}
#clock.ready { color: var(--ready); }
#clock.inspect { color: var(--accent-2); }
#clock.warn { color: var(--warn); }
#clock.danger { color: var(--danger); }
#clock.running { color: var(--accent); }
.hint { margin-top: 14px; color: var(--muted); font-size: 13px; text-align: center; }
.hint kbd {
  font-family: ui-monospace, Menlo, Consolas, monospace;
  border: 1px solid var(--line2);
  border-radius: 8px;
  padding: 2px 7px;
  font-size: 11px;
}
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 12px 12px; }
.stat { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.stat span { display: block; color: var(--faint); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
.stat b { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 16px; }
.detail { padding: 0 16px 16px; color: var(--muted); font-size: 13px; }
.detail .big { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 28px; color: var(--text); margin: 4px 0 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.btn {
  border: 1px solid var(--line2);
  background: var(--bg2);
  color: var(--text);
  border-radius: 999px;
  padding: 8px 12px;
  font: 600 12px system-ui, sans-serif;
  cursor: pointer;
}
.btn.good { background: var(--accent-dim); color: var(--accent); border-color: transparent; }
.btn.bad { background: rgba(255, 93, 115, 0.12); color: var(--danger); border-color: transparent; }
.btn.warn { background: rgba(255, 176, 32, 0.14); color: var(--plus); border-color: transparent; }
footer { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--faint); font-size: 12px; }
dialog {
  border: 1px solid var(--line2);
  background: var(--panel-solid);
  color: var(--text);
  border-radius: 24px;
  padding: 0;
  width: min(520px, calc(100vw - 24px));
}
.dlg { padding: 22px; }
.dlg h3 { margin: 0 0 6px; font-size: 20px; }
.dlg p { color: var(--muted); margin: 0 0 16px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
input[type="text"] {
  background: var(--bg0); color: var(--text); border: 1px solid var(--line2);
  border-radius: 12px; padding: 8px 10px; font: 500 14px system-ui, sans-serif; width: 160px;
}
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--panel-solid); border: 1px solid var(--line2); color: var(--text);
  padding: 10px 14px; border-radius: 999px; opacity: 0; pointer-events: none; z-index: 20;
}
.toast.show { opacity: 1; }
@media (max-width: 980px) {
  .stage { grid-template-columns: 1fr; }
  .stage .timer-card { order: -1; }
  .preview { display: none; }
  .scramble-wrap { grid-template-columns: 1fr; }
  #clock { font-size: clamp(56px, 18vw, 96px); }
  .panel { max-height: 320px; }
  .timer-card { min-height: 260px; }
}
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">FM</div>
        <div>
          <h1>Flashmat</h1>
          <small>Speedcubing timer</small>
        </div>
      </div>
      <select class="chip" id="eventSelect"></select>
      <select class="chip" id="sessionSelect"></select>
      <button class="chip" id="newSessionBtn" type="button">New session</button>
      <button class="chip" id="nextScrambleBtn" type="button">Next scramble</button>
      <div class="spacer"></div>
      <button class="icon" id="themeBtn" type="button">◐</button>
      <button class="icon" id="helpBtn" type="button">?</button>
      <button class="icon" id="settingsBtn" type="button">⚙</button>
    </header>
    <div class="scramble-wrap">
      <div class="scramble" id="scrambleBox"><b id="scrambleText">Ready</b></div>
      <div class="preview" id="preview"></div>
    </div>
    <div class="stage">
      <section class="panel">
        <h2>Session stats</h2>
        <div class="stats-grid" id="statsGrid"></div>
        <h2>Averages</h2>
        <div class="stats-grid" id="avgGrid"></div>
      </section>
      <section class="panel timer-card" id="timerPad">
        <div class="state-pill" id="statePill">Ready</div>
        <div id="clock">0.00</div>
        <div class="hint" id="hint">Tap or press space to start</div>
      </section>
      <section class="panel">
        <h2>Times <span id="countLabel">0</span></h2>
        <div class="list" id="solveList"></div>
      </section>
    </div>
    <footer>
      <span>Space starts · Esc cancels · Delete drops last time</span>
      <div class="spacer"></div>
      <button class="btn" id="exportBtn" type="button">Export CSV</button>
      <button class="btn" id="addBtn" type="button">Add time</button>
      <button class="btn bad" id="clearBtn" type="button">Clear session</button>
    </footer>
  </div>
  <section class="panel" id="detailDock" style="display:none;position:fixed;right:16px;bottom:16px;width:min(360px,calc(100vw - 32px));z-index:8;">
    <h2>Selected solve <button class="btn" id="closeDetail" type="button">Close</button></h2>
    <div class="detail" id="detailBody"></div>
  </section>
  <dialog id="settingsDlg">
    <div class="dlg">
      <h3>Settings</h3>
      <div class="row">
        <label>Inspection</label>
        <select class="chip" id="inspSelect">
          <option value="0">Off</option>
          <option value="8">8s</option>
          <option value="15" selected>15s</option>
          <option value="17">17s</option>
        </select>
      </div>
      <div class="row"><label>Hold to start</label><input type="checkbox" id="holdToggle" /></div>
      <div class="row"><label>Sounds</label><input type="checkbox" id="soundToggle" checked /></div>
      <div class="row"><label>Milliseconds</label><input type="checkbox" id="milliToggle" /></div>
      <div class="dlg-actions"><button class="btn" id="closeSettings" type="button">Done</button></div>
    </div>
  </dialog>
  <dialog id="helpDlg">
    <div class="dlg">
      <h3>How to use Flashmat</h3>
      <p>Tap the big time or press space. Inspection is 15 seconds.</p>
      <div class="dlg-actions"><button class="btn good" id="closeHelp" type="button">Got it</button></div>
    </div>
  </dialog>
  <dialog id="promptDlg">
    <form class="dlg" method="dialog" id="promptForm">
      <h3 id="promptTitle">Name</h3>
      <p id="promptText"></p>
      <input type="text" id="promptInput" autocomplete="off" />
      <div class="dlg-actions">
        <button class="btn" value="cancel" type="submit">Cancel</button>
        <button class="btn good" value="ok" type="submit">Save</button>
      </div>
    </form>
  </dialog>
  <div class="toast" id="toast"></div>
    <script>
const FACES = ["U", "D", "L", "R", "F", "B"];
const OPP = { U: "D", D: "U", L: "R", R: "L", F: "B", B: "F" };
const MODS = ["", "'", "2"];
const COLORS = { U: "#f4f7ff", D: "#ffd54a", F: "#3dffb0", B: "#6ea8ff", L: "#ff9a3d", R: "#ff5d73" };
const EVENTS = {
  "333": { name: "3x3x3", moves: 20, faces: FACES, extra: [] },
  "222": { name: "2x2x2", moves: 9, faces: FACES, extra: [] },
  "444": { name: "4x4x4", moves: 44, faces: FACES, extra: ["Uw", "Dw", "Lw", "Rw", "Fw", "Bw"] },
  "pyram": { name: "Pyraminx", moves: 11, faces: ["U", "L", "R", "B"], extra: [] },
  "skewb": { name: "Skewb", moves: 9, faces: ["U", "L", "R", "B"], extra: [] },
  "333oh": { name: "3x3 OH", moves: 20, faces: FACES, extra: [] }
};
const storeKey = "flashmat.v1";
const state = { phase: "idle", holdTimer: null, inspectLeft: 0, inspectId: null, startAt: 0, raf: 0, scramble: "", selectedId: null, lastBeep: "" };
const defaultSettings = { theme: "dark", inspection: 15, hold: false, sound: true, milli: false, event: "333" };
let db = load();
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(storeKey));
    if (raw && raw.sessions) return raw;
  } catch {}
  const id = uid();
  return { settings: { ...defaultSettings }, currentSession: id, sessions: [{ id, name: "Home practice", event: "333", solves: [] }] };
}
function save() { localStorage.setItem(storeKey, JSON.stringify(db)); }
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function session() { return db.sessions.find(s => s.id === db.currentSession) || db.sessions[0]; }
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 1600);
}
function beep(kind) {
  if (!db.settings.sound) return;
  const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  const now = ctx.currentTime;
  o.frequency.value = kind === "go" ? 980 : 740;
  g.gain.setValueAtTime(0.05, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
  o.start(now); o.stop(now + 0.13);
}
function rand(arr) { return arr[(Math.random() * arr.length) | 0]; }
function generateScramble(eventId) {
  const ev = EVENTS[eventId] || EVENTS["333"];
  const pool = ev.faces.concat(ev.extra);
  const moves = [];
  let last = "";
  while (moves.length < ev.moves) {
    const face = rand(pool);
    const base = face[0];
    if (base === last) continue;
    last = base;
    moves.push(face + rand(MODS));
  }
  if (eventId === "pyram") ["u", "l", "r", "b"].forEach(t => { if (Math.random() < 0.75) moves.push(t + rand(["", "'"])); });
  return moves.join(" ");
}
function createCube() {
  const face = (c) => Array(9).fill(c);
  return { U: face("U"), D: face("D"), F: face("F"), B: face("B"), L: face("L"), R: face("R") };
}
function rotateFace(f, n) {
  const c = f.slice();
  const cycles = [0, 2, 8, 6], edges = [1, 5, 7, 3];
  for (let k = 0; k < n; k++) {
    const a = cycles.map(i => c[i]), b = edges.map(i => c[i]);
    cycles.forEach((i, idx) => c[i] = a[(idx + 3) % 4]);
    edges.forEach((i, idx) => c[i] = b[(idx + 3) % 4]);
  }
  return c;
}
function cycle(cube, strips, n) {
  for (let k = 0; k < n; k++) {
    const vals = strips.map(([f, i]) => cube[f][i]);
    strips.forEach(([f, i], idx) => { cube[f][i] = vals[(idx + 3) % strips.length]; });
  }
}
const MOVE_MAP = {
  U: { face: "U", strips: [["B",0],["B",1],["B",2],["R",0],["R",1],["R",2],["F",0],["F",1],["F",2],["L",0],["L",1],["L",2]] },
  D: { face: "D", strips: [["F",6],["F",7],["F",8],["R",6],["R",7],["R",8],["B",6],["B",7],["B",8],["L",6],["L",7],["L",8]] },
  F: { face: "F", strips: [["U",6],["U",7],["U",8],["R",0],["R",3],["R",6],["D",2],["D",1],["D",0],["L",8],["L",5],["L",2]] },
  B: { face: "B", strips: [["U",2],["U",1],["U",0],["L",0],["L",3],["L",6],["D",6],["D",7],["D",8],["R",8],["R",5],["R",2]] },
  L: { face: "L", strips: [["U",0],["U",3],["U",6],["F",0],["F",3],["F",6],["D",0],["D",3],["D",6],["B",8],["B",5],["B",2]] },
  R: { face: "R", strips: [["U",8],["U",5],["U",2],["B",0],["B",3],["B",6],["D",8],["D",5],["D",2],["F",8],["F",5],["F",2]] }
};
function applyMove(cube, token) {
  const prime = token.endsWith("'");
  const dbl = token.endsWith("2");
  const face = token.replace(/['2]/g, "");
  if (!MOVE_MAP[face]) return;
  const n = dbl ? 2 : prime ? 3 : 1;
  cube[MOVE_MAP[face].face] = rotateFace(cube[MOVE_MAP[face].face], n);
  const s = MOVE_MAP[face].strips;
  [0,1,2].map(off => [0,1,2,3].map(g => s[g * 3 + off])).forEach(g => cycle(cube, g, n));
}
function applyScramble(str) {
  const cube = createCube();
  str.split(/\s+/).filter(Boolean).forEach(m => applyMove(cube, m));
  return cube;
}
function renderPreview(scramble, eventId) {
  const box = document.getElementById("preview");
  if (!["333", "333oh"].includes(eventId)) {
    box.innerHTML = `<div style="font-size:11px;color:var(--faint)">${EVENTS[eventId].name}</div>`;
    return;
  }
  const cube = applyScramble(scramble);
  const faceHtml = (f) => `<div class="face">${cube[f].map(c => `<i class="sticker" style="background:${COLORS[c]}"></i>`).join("")}</div>`;
  box.innerHTML = `<div class="net"><div class="empty"></div>${faceHtml("U")}<div class="empty"></div><div class="empty"></div>${faceHtml("L")}${faceHtml("F")}${faceHtml("R")}${faceHtml("B")}<div class="empty"></div>${faceHtml("D")}<div class="empty"></div><div class="empty"></div></div>`;
}
function formatTime(ms, forceMilli) {
  if (ms == null) return "—";
  if (!isFinite(ms)) return "DNF";
  const milli = forceMilli || db.settings.milli;
  const abs = Math.max(0, ms);
  const m = Math.floor(abs / 60000);
  const s = Math.floor((abs % 60000) / 1000);
  const cs = Math.floor((abs % 1000) / (milli ? 1 : 10));
  const frac = milli ? String(cs).padStart(3, "0") : String(cs).padStart(2, "0");
  if (m > 0) return `${m}:${String(s).padStart(2, "0")}.${frac}`;
  return `${s}.${frac}`;
}
function effective(solve) {
  if (!solve || solve.penalty === "DNF") return Infinity;
  return solve.time + (solve.penalty === "+2" ? 2000 : 0);
}
function displaySolve(solve) {
  if (!solve) return "—";
  if (solve.penalty === "DNF") return "DNF";
  const t = formatTime(effective(solve));
  return solve.penalty === "+2" ? t + "+" : t;
}
function average(list, n, dropEach) {
  if (list.length < n) return null;
  const slice = list.slice(-n).map(effective).sort((a, b) => a - b);
  const mid = slice.slice(dropEach, n - dropEach);
  if (mid.some(v => !isFinite(v))) return Infinity;
  return mid.reduce((a, b) => a + b, 0) / mid.length;
}
function mean(list) {
  if (!list.length) return null;
  const vals = list.map(effective);
  if (vals.some(v => !isFinite(v))) return Infinity;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}
function bestOf(list) {
  const vals = list.map(effective).filter(isFinite);
  return vals.length ? Math.min(...vals) : null;
}
function worstOf(list) {
  if (!list.length) return null;
  const vals = list.map(effective);
  if (vals.some(v => !isFinite(v))) return Infinity;
  return Math.max(...vals);
}
function setTheme(theme) {
  db.settings.theme = theme;
  document.documentElement.setAttribute("data-theme", theme);
  save();
}
function fillSelects() {
  document.getElementById("eventSelect").innerHTML = Object.entries(EVENTS).map(([id, e]) => `<option value="${id}">${e.name}</option>`).join("");
  document.getElementById("eventSelect").value = db.settings.event;
  document.getElementById("sessionSelect").innerHTML = db.sessions.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join("");
  document.getElementById("sessionSelect").value = session().id;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function newScramble() {
  state.scramble = generateScramble(db.settings.event);
  document.getElementById("scrambleText").textContent = state.scramble;
  renderPreview(state.scramble, db.settings.event);
}
function renderStats() {
  const solves = session().solves;
  const cells = [["Solves", String(solves.length)], ["Best", formatTime(bestOf(solves))], ["Worst", formatTime(worstOf(solves))], ["Mean", formatTime(mean(solves))]];
  document.getElementById("statsGrid").innerHTML = cells.map(([k, v]) => `<div class="stat"><span>${k}</span><b>${v}</b></div>`).join("");
  const avgs = [["Mo3", mean(solves.slice(-3))], ["Ao5", average(solves, 5, 1)], ["Ao12", average(solves, 12, 1)], ["Ao50", average(solves, 50, 3)], ["Ao100", average(solves, 100, 5)], ["Session", mean(solves)]];
  document.getElementById("avgGrid").innerHTML = avgs.map(([k, v]) => `<div class="stat"><span>${k}</span><b>${v == null ? "—" : formatTime(v)}</b></div>`).join("");
}
function renderList() {
  const solves = session().solves;
  document.getElementById("countLabel").textContent = solves.length;
  const box = document.getElementById("solveList");
  if (!solves.length) {
    box.innerHTML = `<div class="solve"><span class="t" style="color:var(--faint)">No times yet</span></div>`;
    return;
  }
  box.innerHTML = solves.slice().reverse().map((s, i) => {
    const n = solves.length - i;
    const cls = s.penalty === "DNF" ? "dnf" : s.penalty === "+2" ? "plus" : "";
    return `<div class="solve ${s.id === state.selectedId ? "active" : ""}" data-id="${s.id}"><span class="idx">${n}</span><span class="t ${cls}">${displaySolve(s)}</span><span class="meta">${new Date(s.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span></div>`;
  }).join("");
}
function showDetail(id) {
  const solve = session().solves.find(s => s.id === id);
  const dock = document.getElementById("detailDock");
  if (!solve) { dock.style.display = "none"; return; }
  state.selectedId = id;
  dock.style.display = "flex";
  document.getElementById("detailBody").innerHTML = `<div class="big">${displaySolve(solve)}</div><div>${escapeHtml(solve.scramble)}</div><div class="actions"><button class="btn warn" data-act="plus">+2</button><button class="btn bad" data-act="dnf">DNF</button><button class="btn good" data-act="ok">OK</button><button class="btn bad" data-act="del">Delete</button></div>`;
  renderList();
}
function setPhase(phase, extra) {
  state.phase = phase;
  const pill = document.getElementById("statePill");
  const hint = document.getElementById("hint");
  const insp = db.settings.inspection;
  if (phase === "idle") {
    pill.textContent = "Ready";
    document.getElementById("clock").className = "";
    hint.textContent = insp > 0 ? "Tap or press space to start inspection" : "Tap or press space to start";
  } else if (phase === "holding") {
    pill.textContent = "Hold";
    document.getElementById("clock").className = "ready";
    hint.textContent = "Release to start";
  } else if (phase === "inspect") {
    pill.textContent = "Inspection";
    hint.textContent = "Tap when you start turning";
  } else if (phase === "running") {
    pill.textContent = "Solving";
    document.getElementById("clock").className = "running";
    hint.textContent = "Tap or space to stop";
  } else if (phase === "stopped") {
    pill.textContent = extra || "Stopped";
    document.getElementById("clock").className = "";
  }
}
function clearTimers() {
  if (state.inspectId) clearInterval(state.inspectId);
  if (state.holdTimer) clearTimeout(state.holdTimer);
  if (state.raf) cancelAnimationFrame(state.raf);
  state.inspectId = state.holdTimer = state.raf = 0;
}
function startInspection() {
  clearTimers();
  const total = db.settings.inspection;
  if (!total) { startRun(); return; }
  state.inspectLeft = total;
  state.lastBeep = "";
  setPhase("inspect");
  const tick = () => {
    const clock = document.getElementById("clock");
    if (state.inspectLeft > 0) {
      clock.textContent = String(Math.max(0, Math.ceil(state.inspectLeft)));
      clock.className = state.inspectLeft <= 3 ? "danger" : state.inspectLeft <= 8 ? "warn" : "inspect";
      if (Math.ceil(state.inspectLeft) === 8 && state.lastBeep !== "8") { beep("eight"); state.lastBeep = "8"; }
    } else if (state.inspectLeft > -2) {
      clock.textContent = "+2"; clock.className = "warn";
    } else {
      clock.textContent = "DNF"; clock.className = "danger";
    }
  };
  tick();
  const started = performance.now();
  state.inspectId = setInterval(() => {
    state.inspectLeft = total - (performance.now() - started) / 1000;
    tick();
  }, 50);
}
function startRun() {
  clearTimers();
  let penalty = null;
  if (db.settings.inspection > 0 && state.phase === "inspect") {
    if (state.inspectLeft <= -2) penalty = "DNF";
    else if (state.inspectLeft <= 0) penalty = "+2";
  }
  state.pendingPenalty = penalty;
  state.startAt = performance.now();
  setPhase("running");
  beep("go");
  const loop = () => {
    if (state.phase !== "running") return;
    document.getElementById("clock").textContent = formatTime(performance.now() - state.startAt);
    state.raf = requestAnimationFrame(loop);
  };
  state.raf = requestAnimationFrame(loop);
}
function stopRun() {
  if (state.phase !== "running") return;
  const time = performance.now() - state.startAt;
  clearTimers();
  const solve = { id: uid(), time: Math.round(time), penalty: state.pendingPenalty || null, scramble: state.scramble, event: db.settings.event, at: Date.now() };
  session().solves.push(solve);
  save();
  document.getElementById("clock").textContent = displaySolve(solve);
  setPhase("stopped", solve.penalty === "DNF" ? "DNF" : "Logged");
  renderStats(); renderList(); showDetail(solve.id);
  newScramble();
  setTimeout(() => { if (state.phase === "stopped") setPhase("idle"); }, 450);
}
function cancelInspect() {
  if (state.phase !== "inspect" && state.phase !== "holding") return;
  clearTimers();
  document.getElementById("clock").textContent = lastSolve() ? displaySolve(lastSolve()) : "0.00";
  setPhase("idle");
}
function onDown(e) {
  if (isTyping(e) || e.repeat) return;
  if (state.phase === "running" || state.phase === "inspect" || state.phase === "stopped") return;
  if (db.settings.hold && (db.settings.inspection === 0 || state.phase === "idle")) {
    state.holdTimer = setTimeout(() => setPhase("holding"), 280);
  }
}
function onUp(e) {
  if (isTyping(e)) return;
  if (state.phase === "running") { stopRun(); return; }
  if (state.phase === "inspect") { startRun(); return; }
  if (state.phase === "holding") { startInspection(); return; }
  if (state.holdTimer) { clearTimeout(state.holdTimer); state.holdTimer = 0; }
  if (state.phase === "idle") {
    if (db.settings.hold && db.settings.inspection === 0) return;
    startInspection();
  }
}
function isTyping(e) {
  const el = e.target;
  return el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT");
}
function lastSolve() { return session().solves.at(-1); }
function setPenalty(solve, p) {
  if (!solve) return;
  solve.penalty = solve.penalty === p ? null : p;
  save(); renderStats(); renderList();
  if (state.selectedId === solve.id) showDetail(solve.id);
  if (solve === lastSolve() && state.phase === "idle") document.getElementById("clock").textContent = displaySolve(solve);
}
function deleteSolve(id) {
  session().solves = session().solves.filter(x => x.id !== id);
  save();
  if (state.selectedId === id) {
    state.selectedId = null;
    document.getElementById("detailDock").style.display = "none";
  }
  renderStats(); renderList();
}
function exportCsv() {
  const rows = [["index", "time_ms", "display", "penalty", "scramble", "event", "when"]];
  session().solves.forEach((s, i) => rows.push([i + 1, s.time, displaySolve(s), s.penalty || "", s.scramble, s.event, new Date(s.at).toISOString()]));
  const csv = rows.map(r => r.map(v => `"${String(v).replaceAll('"', '""')}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "times.csv";
  a.click();
}
async function promptText(title, text, value) {
  const dlg = document.getElementById("promptDlg");
  document.getElementById("promptTitle").textContent = title;
  document.getElementById("promptText").textContent = text;
  const input = document.getElementById("promptInput");
  input.value = value || "";
  dlg.showModal();
  return new Promise(resolve => {
    document.getElementById("promptForm").onsubmit = (e) => {
      e.preventDefault();
      const ok = e.submitter && e.submitter.value === "ok";
      dlg.close();
      resolve(ok ? input.value.trim() : null);
    };
  });
}
function bind() {
  const pad = document.getElementById("timerPad");
  pad.addEventListener("pointerdown", (e) => { if (e.button === 0) onDown(e); });
  pad.addEventListener("pointerup", (e) => { if (e.button === 0) onUp(e); });
  window.addEventListener("keydown", (e) => {
    if (isTyping(e)) return;
    if (e.code === "Space") { e.preventDefault(); onDown(e); }
    if (e.key === "Escape") cancelInspect();
    if (e.key === "Backspace" || e.key === "Delete") { e.preventDefault(); if (lastSolve()) deleteSolve(lastSolve().id); }
    if (e.key === "2") setPenalty(lastSolve(), "+2");
    if (e.key.toLowerCase() === "d") setPenalty(lastSolve(), "DNF");
    if (e.key.toLowerCase() === "n") newScramble();
  });
  window.addEventListener("keyup", (e) => {
    if (isTyping(e)) return;
    if (e.code === "Space") { e.preventDefault(); onUp(e); }
  });
  document.getElementById("eventSelect").onchange = (e) => { db.settings.event = e.target.value; save(); newScramble(); };
  document.getElementById("sessionSelect").onchange = (e) => { db.currentSession = e.target.value; save(); renderAll(); };
  document.getElementById("nextScrambleBtn").onclick = newScramble;
  document.getElementById("newSessionBtn").onclick = async () => {
    const name = await promptText("New session", "Name this session", "School practice");
    if (!name) return;
    const s = { id: uid(), name, event: db.settings.event, solves: [] };
    db.sessions.push(s); db.currentSession = s.id; save(); fillSelects(); renderAll();
  };
  document.getElementById("themeBtn").onclick = () => setTheme(db.settings.theme === "dark" ? "light" : "dark");
  document.getElementById("settingsBtn").onclick = () => document.getElementById("settingsDlg").showModal();
  document.getElementById("helpBtn").onclick = () => document.getElementById("helpDlg").showModal();
  document.getElementById("closeSettings").onclick = () => document.getElementById("settingsDlg").close();
  document.getElementById("closeHelp").onclick = () => document.getElementById("helpDlg").close();
  document.getElementById("inspSelect").onchange = (e) => { db.settings.inspection = Number(e.target.value); save(); setPhase("idle"); };
  document.getElementById("holdToggle").onchange = (e) => { db.settings.hold = e.target.checked; save(); setPhase("idle"); };
  document.getElementById("soundToggle").onchange = (e) => { db.settings.sound = e.target.checked; save(); };
  document.getElementById("milliToggle").onchange = (e) => { db.settings.milli = e.target.checked; save(); renderAll(); };
  document.getElementById("scrambleBox").onclick = async () => {
    try { await navigator.clipboard.writeText(state.scramble); toast("Scramble copied"); } catch {}
  };
  document.getElementById("solveList").onclick = (e) => {
    const row = e.target.closest(".solve");
    if (row && row.dataset.id) showDetail(row.dataset.id);
  };
  document.getElementById("closeDetail").onclick = () => { state.selectedId = null; document.getElementById("detailDock").style.display = "none"; renderList(); };
  document.getElementById("detailBody").onclick = (e) => {
    const act = e.target.dataset.act;
    const solve = session().solves.find(s => s.id === state.selectedId);
    if (!solve || !act) return;
    if (act === "plus") setPenalty(solve, "+2");
    if (act === "dnf") setPenalty(solve, "DNF");
    if (act === "ok") { solve.penalty = null; save(); renderStats(); renderList(); showDetail(solve.id); }
    if (act === "del") deleteSolve(solve.id);
  };
  document.getElementById("exportBtn").onclick = exportCsv;
  document.getElementById("addBtn").onclick = async () => {
    const raw = await promptText("Add a time", "Type seconds like 12.45", "");
    if (!raw) return;
    const n = Number(raw);
    if (!isFinite(n) || n <= 0) return toast("Could not read that time");
    session().solves.push({ id: uid(), time: Math.round(n * 1000), penalty: null, scramble: state.scramble, event: db.settings.event, at: Date.now() });
    save(); renderAll(); newScramble();
  };
  document.getElementById("clearBtn").onclick = async () => {
    const ok = await promptText("Clear session", "Type CLEAR to delete times", "");
    if (ok !== "CLEAR") return;
    session().solves = []; save(); renderAll();
    document.getElementById("clock").textContent = "0.00";
  };
}
function renderAll() {
  fillSelects(); renderStats(); renderList();
  document.getElementById("inspSelect").value = String(db.settings.inspection);
  document.getElementById("holdToggle").checked = db.settings.hold;
  document.getElementById("soundToggle").checked = db.settings.sound;
  document.getElementById("milliToggle").checked = db.settings.milli;
  if (state.phase === "idle") document.getElementById("clock").textContent = lastSolve() ? displaySolve(lastSolve()) : "0.00";
}
function init() {
  db.settings = { ...defaultSettings, ...db.settings };
  setTheme(db.settings.theme || "dark");
  fillSelects(); bind(); newScramble(); renderAll(); setPhase("idle");
}
init();
  </script>
